name: update
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python generate.py
      - run: |
          git config user.name bot
          git config user.email bot@github.com
          git add us.ics
          git commit -m "update" || true
          git push
