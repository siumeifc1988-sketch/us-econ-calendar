name: Sync & Translate BLS & FOMC Calendar
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 自動執行
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests googletrans==4.0.0-rc1 legacy-cgi beautifulsoup4

      - name: Download, Format and Combine ICS
        run: python sync_calendar.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bls_zh.ics
          git commit -m "Auto update BLS and FOMC calendar" || exit 0
          git push
